services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    ports:
      - "3000:3000"
      - "4040:4040"
    volumes:
      - ..:/workspace:cached
      - /workspace/node_modules
    env_file:
      - .env.devcontainer
    command: sleep infinity
